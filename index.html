<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Map | Landing App</title>

  <!-- Fonts: Industrial Techno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Landing View -->
  <div id="landing-view" class="landing-view active">
    <!-- Full Bleed Logo Background -->
    <div class="landing-logo-bg"></div>

    <!-- Minimal Overlay Content -->
    <div class="landing-overlay-content">
      <button id="start-app-btn" class="landing-cta-btn">
        Enter
      </button>
    </div>
  </div>

  <!-- App View -->
  <div id="app-view" class="app-view">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <button id="toggle-sidebar-btn" class="btn btn-icon" title="Toggle Sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1>My Food Map</h1>
    </div>
    <div class="header-actions">
      <button id="add-poi-btn" class="btn btn-primary header-add-btn" title="Click, then click map to add place">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Add Place</span>
      </button>
      <div class="header-divider"></div>
      <div class="header-group">
        <button id="locate-btn" class="btn header-icon-btn" title="Find my location">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
          <span>Locate</span>
        </button>
        <button id="analytics-btn" class="btn header-icon-btn" title="View analytics">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
          <span>Analytics</span>
        </button>
      </div>
      <div class="header-divider"></div>
      <div class="header-group">
        <button id="export-btn" class="btn btn-icon" title="Export data">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button id="import-btn" class="btn btn-icon" title="Import data">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
      <input type="file" id="import-input" accept=".json,.geojson" style="display: none;">
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- Search -->
      <div class="search-section">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search places..."
        >
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs" id="category-tabs">
        <button class="category-tab category-tab-all active" data-category="all">All <span class="tab-count"></span></button>
        <button class="category-tab" data-category="restaurant">Restaurant <span class="tab-count"></span></button>
        <button class="category-tab" data-category="cafe">Café <span class="tab-count"></span></button>
        <button class="category-tab" data-category="bar">Bar <span class="tab-count"></span></button>
        <button class="category-tab" data-category="bakery">Bakery <span class="tab-count"></span></button>
        <button class="category-tab" data-category="market">Market <span class="tab-count"></span></button>
        <button class="category-tab" data-category="other">Other <span class="tab-count"></span></button>
      </div>

      <!-- Status Tabs -->
      <div class="status-tabs" id="status-tabs">
        <button class="status-tab active" data-status="all">All <span class="tab-count"></span></button>
        <button class="status-tab" data-status="visited">Visited <span class="tab-count"></span></button>
        <button class="status-tab" data-status="wishlist">Wishlist <span class="tab-count"></span></button>
      </div>

      <!-- Tag Filters -->
      <div class="filter-section">
        <h2>Filter by Tags</h2>
        <div id="tag-filters" class="tag-filters">
          <!-- Tags will be dynamically added here -->
        </div>
        <button id="clear-filters-btn" class="btn btn-secondary">Clear All</button>
      </div>

      <!-- POI List -->
      <div class="poi-list-section" id="poi-list-section">
        <h2 class="sidebar-section-heading">Places <span id="poi-list-count" class="tab-count"></span></h2>
        <div id="poi-list-items" class="poi-list-items"></div>
      </div>

      <!-- Distance Info -->
      <div id="distance-info" class="info-section">
        <!-- Distance info appears after using "Locate Me" -->
      </div>
    </aside>

    <!-- Map -->
    <main class="main-content">
      <div id="map"></div>
    </main>
  </div>

  <!-- Modal for Add/Edit POI -->
  <div id="poi-modal" class="modal">
    <div class="modal-content modal-large poi-modal-content">

      <!-- Hero header -->
      <div class="poi-hero" id="poi-hero">
        <div class="poi-hero-bar" id="poi-hero-bar"></div>
        <h2 class="poi-hero-title" id="poi-hero-title">New Place</h2>
        <button type="button" id="cancel-btn" class="poi-hero-close" title="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="poi-form">
        <input type="hidden" id="poi-id">
        <input type="hidden" id="poi-lat" name="lat">
        <input type="hidden" id="poi-lng" name="lng">

        <!-- Tab bar -->
        <div class="poi-tabs" id="poi-tabs">
          <button type="button" class="poi-tab active" data-tab="details">Details</button>
          <button type="button" class="poi-tab" data-tab="reviews" id="poi-tab-reviews" style="display:none">Reviews</button>
          <button type="button" class="poi-tab" data-tab="history" id="poi-tab-history" style="display:none">History</button>
        </div>

        <!-- Details panel -->
        <div class="poi-panel active" id="poi-panel-details">

          <div class="form-group">
            <label for="poi-name">Name *</label>
            <input type="text" id="poi-name" name="name" required placeholder="Place name">
          </div>

          <div class="form-group">
            <label>Category</label>
            <div class="cat-tile-grid" id="poi-category-selector">
              <button type="button" class="cat-tile active" data-category="restaurant">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><line x1="7" y1="2" x2="7" y2="22"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
                <span>Restaurant</span>
              </button>
              <button type="button" class="cat-tile" data-category="cafe">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                <span>Café</span>
              </button>
              <button type="button" class="cat-tile" data-category="bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M12 11.5V22"/><path d="M6.5 2h11L15 9a4 4 0 0 1-6 0L6.5 2z"/></svg>
                <span>Bar</span>
              </button>
              <button type="button" class="cat-tile" data-category="bakery">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <span>Bakery</span>
              </button>
              <button type="button" class="cat-tile" data-category="market">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                <span>Market</span>
              </button>
              <button type="button" class="cat-tile" data-category="other">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>
                <span>Other</span>
              </button>
            </div>
            <input type="hidden" id="poi-category" name="category" value="restaurant">
          </div>

          <div class="form-group">
            <label>Status</label>
            <div class="status-tile-row" id="poi-status-selector">
              <button type="button" class="status-tile active" data-status="visited">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Visited</span>
              </button>
              <button type="button" class="status-tile" data-status="wishlist">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span>Wishlist</span>
              </button>
            </div>
            <input type="hidden" id="poi-status" name="status" value="visited">
          </div>

          <div class="form-group poi-visited-only">
            <label>Rating</label>
            <div class="rating-input">
              <span class="star" data-rating="1">☆</span>
              <span class="star" data-rating="2">☆</span>
              <span class="star" data-rating="3">☆</span>
              <span class="star" data-rating="4">☆</span>
              <span class="star" data-rating="5">☆</span>
            </div>
            <input type="hidden" id="poi-rating" name="rating" value="0">
          </div>

          <div class="form-group poi-visited-only">
            <label>Tags</label>
            <div class="tag-chip-input" id="tag-chip-container">
              <input type="text" id="tag-chip-text" class="tag-chip-text" placeholder="Add tag…" autocomplete="off">
            </div>
            <input type="hidden" id="poi-tags" name="tags">
            <div id="tag-suggestions" class="tag-suggestions" style="display:none"></div>
          </div>

          <div class="form-group">
            <label for="poi-comments">Notes</label>
            <textarea id="poi-comments" name="comments" rows="2" placeholder="Quick notes…"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" id="delete-btn" class="btn btn-danger" style="display:none">Delete</button>
          </div>

        </div>

        <!-- Reviews panel -->
        <div class="poi-panel" id="poi-panel-reviews">
          <div id="reviews-list"></div>
          <div class="review-form">
            <h3>Add Review</h3>
            <div class="form-group">
              <label>Rating</label>
              <div class="rating-input">
                <span class="star review-star" data-rating="1">☆</span>
                <span class="star review-star" data-rating="2">☆</span>
                <span class="star review-star" data-rating="3">☆</span>
                <span class="star review-star" data-rating="4">☆</span>
                <span class="star review-star" data-rating="5">☆</span>
              </div>
              <input type="hidden" id="review-rating" value="0">
            </div>
            <div class="form-group">
              <label for="review-text">Review</label>
              <textarea id="review-text" rows="3" placeholder="What did you think about this place?"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" id="add-review-btn" class="btn btn-primary">Add Review</button>
            </div>
          </div>
        </div>

        <!-- History panel -->
        <div class="poi-panel" id="poi-panel-history">
          <div id="timeline-view"></div>
        </div>

      </form>
    </div>
  </div>

  <!-- Modal for Analytics -->
  <div id="analytics-modal" class="modal">
    <div class="modal-content modal-xlarge">
      <div class="modal-header">
        <h2>Analytics Dashboard</h2>
        <button type="button" id="close-analytics-btn" class="btn btn-secondary">Close</button>
      </div>
      <div id="analytics-content" style="max-height: 80vh; overflow-y: auto;">
        <!-- Analytics content will be rendered here -->
      </div>
    </div>
  </div>

  </div> <!-- End app-view -->

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
